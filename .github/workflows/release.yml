# Publishes a GitHub Release whenever a v* tag is pushed, but only after the
# tagged commit passes the full gate: type check, tests, Biome, and the
# dogfood lint (ExplicitJS run on its own source). Nothing ships that fails
# its own rules. The release also gets an npm-installable tarball attached
# (compiled dist/) so pnpm/npm users don't need to clone
# the repo to use it — see docs/install.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm check
      - name: Test
        run: pnpm test
      - name: Format & lint
        run: pnpm fmt:check
      - name: Dogfood lint
        run: pnpm lint
      - name: Build & pack tarball
        run: pnpm pack
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes ./*.tgz
        env:
          GH_TOKEN: ${{ github.token }}

# Publishes a GitHub Release whenever a v* tag is pushed, but only after the
# tagged commit passes the full gate: type check, tests, and the dogfood lint
# (ExplicitJS run on its own source). Nothing ships that fails its own rules.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Dogfood lint
        run: deno task lint
      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
